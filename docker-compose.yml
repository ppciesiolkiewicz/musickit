# Local Postgres for accounts (npm run db:up). Port 5433 on the host, so it never clashes with a Postgres already on 5432.
# DATABASE_URL=postgres://musickit:musickit@localhost:5433/musickit
services:
  db:
    image: postgres:17-alpine
    container_name: musickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: musickit
      POSTGRES_PASSWORD: musickit
      POSTGRES_DB: musickit
    ports:
      - "5433:5432"
    volumes:
      - musickit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musickit -d musickit"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  musickit-db:
